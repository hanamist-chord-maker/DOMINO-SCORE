<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HANAMIST SCORE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root{--bg:#0a0614;--p1:#7a2cff;--p2:#4b14b8;--p3:#2a0a6b;--gold:#ffd23a;--red:#ff2a3d;--ink:#2a0a6b;--soft:#efe6ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% -10%,#3b11a0 0,transparent 55%),radial-gradient(circle at 90% 100%,#2a0a6b 0,transparent 45%),var(--bg);background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(115deg,transparent 0 60px,rgba(122,44,255,.07) 60px 120px)}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.view{display:none;position:relative;max-width:980px;margin:0 auto;padding:14px 14px 24px;min-height:100vh}
.view.active{display:block;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
img{max-width:100%;display:block}
.btn3d{position:relative;border-radius:999px;padding:12px 26px;font-weight:800;font-size:1.25rem;background:linear-gradient(#a05bff,#6a1fe6 55%,#5513c4);box-shadow:0 6px 0 #34098a,0 10px 22px rgba(122,44,255,.55),inset 0 2px 0 rgba(255,255,255,.55);text-shadow:0 2px 0 #34098a;transition:transform .08s,box-shadow .08s}
.btn3d:active{transform:translateY(5px);box-shadow:0 1px 0 #34098a,0 4px 10px rgba(122,44,255,.5),inset 0 2px 0 rgba(255,255,255,.5)}
.btn3d:disabled{filter:grayscale(.8) brightness(.7);pointer-events:none}
.btn3d.alt{background:linear-gradient(#e8dcff,#c4a6ff);color:var(--ink);text-shadow:none;box-shadow:0 5px 0 #8c63d8,0 8px 16px rgba(122,44,255,.4),inset 0 2px 0 #fff}
.btn3d.dark{background:linear-gradient(#5a22c8,#3a0f94);box-shadow:0 5px 0 #1e0658,0 8px 16px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.3)}
/* home */
.home-logo{width:min(560px,92%);margin:0 auto;filter:drop-shadow(0 0 28px rgba(122,44,255,.7))}
.menu{display:grid;gap:18px;max-width:600px;margin:18px auto 0}
.mbtn{display:flex;align-items:center;gap:10px;width:100%;min-height:118px;padding:6px 14px 0 8px;border-radius:30px;text-align:left;background:linear-gradient(135deg,#6b25e8,#2b0b78 70%);border:3px solid #9a5bff;box-shadow:0 0 26px rgba(122,44,255,.55),inset 0 0 22px rgba(255,255,255,.12);overflow:hidden;transition:transform .15s}
.mbtn:hover{transform:translateY(-3px)}.mbtn:active{transform:scale(.98)}
.mbtn img{height:112px;width:auto;align-self:flex-end;flex:0 0 auto}
.mbtn .t{flex:1;border-left:2px solid rgba(190,150,255,.6);padding-left:16px;font-size:clamp(1.3rem,5vw,1.9rem);font-weight:800;line-height:1.1}
.mbtn .t small{display:block;color:#cdb6ff;font-weight:500;font-size:.75em}
.mbtn .go{flex:0 0 46px;height:46px;border-radius:50%;background:linear-gradient(#a05bff,#6a1fe6);display:grid;place-items:center;font-size:1.7rem;box-shadow:0 0 14px #9a5bff}
.foot{text-align:center;margin-top:22px;color:#b99aff;font-style:italic}
.foot b{display:block;letter-spacing:.35em;font-style:normal;color:#9a5bff}
/* header */
.hd{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.hd .lg{height:70px;width:auto}
.hd .tt{flex:1;text-align:center;font-weight:800;font-size:clamp(1.5rem,5.5vw,2.6rem);line-height:1;text-shadow:0 3px 0 #34098a,0 0 20px rgba(122,44,255,.8)}
.hd .tt small{display:block;font-size:.4em;font-style:italic;font-weight:500;color:#cdb6ff;margin-top:4px;text-shadow:none}
.home-ic{flex:0 0 52px;height:52px;border-radius:50%;font-size:1.6rem;background:linear-gradient(#a05bff,#5513c4);box-shadow:0 0 16px #7a2cff,inset 0 2px 0 rgba(255,255,255,.5)}
/* setup */
.setup{display:grid;gap:14px;margin:6px auto;max-width:760px}
.setup.two{grid-template-columns:1fr 1fr}
.gcard{position:relative;padding:34px 12px 14px;border-radius:26px;border:3px solid #8a45ff;background:linear-gradient(#35108a,#1d0850);box-shadow:0 0 22px rgba(122,44,255,.5);margin-top:6px}
.gcard h3{position:absolute;left:50%;top:-14px;transform:translateX(-50%);margin:0;padding:2px 28px;border-radius:18px;background:linear-gradient(#a05bff,#6a1fe6);font-size:1.4rem;white-space:nowrap}
.inp{display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:16px;background:linear-gradient(#fff,var(--soft));border:2px solid #b78bff;box-shadow:inset 0 -3px 0 #d6c2ff}
.inp i{font-style:normal;font-size:1.5rem}
.inp input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:700;font-size:1.25rem;padding:10px 4px}
.inp input::placeholder{color:#7b6ba6;font-style:italic;font-weight:500}
.prow{display:flex;align-items:center;gap:0}
.prow .n{flex:0 0 52px;height:52px;margin-right:-14px;z-index:1;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;font-weight:800;background:linear-gradient(#a05bff,#5513c4);border:3px solid #c9a6ff;box-shadow:0 0 12px #7a2cff}
.prow .inp{flex:1;border-radius:999px;padding-left:22px}
.act{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px}
.mascots{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:10px}
.mascots img{height:clamp(120px,28vw,230px);width:auto}
.err{text-align:center;color:#ffd0d5;min-height:1.5em;font-weight:700;margin-top:6px}
/* game */
.pgrid{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.pn{position:relative;border-radius:22px;background:linear-gradient(#fff,#e6d8ff);color:var(--ink);border:3px solid #8a45ff;box-shadow:0 0 18px rgba(122,44,255,.45);overflow:hidden;cursor:pointer;transition:box-shadow .2s,transform .2s}
.pn.sel{box-shadow:0 0 0 3px var(--gold),0 0 34px rgba(255,210,58,.7);transform:translateY(-2px)}
.pn .nm{padding:4px 8px;text-align:center;font-weight:800;font-size:1.3rem;background:linear-gradient(#4b14b8,#2a0a6b);color:#fff;border-bottom:4px solid var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn .sc{text-align:center;font-size:clamp(3rem,13vw,5.2rem);font-weight:800;line-height:1.05;color:#1a0450;transition:transform .2s}
.pn .sc.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.25);color:#7a2cff}}
.pn .bt{display:flex;gap:8px;padding:0 10px}
.pn .bt button{flex:1;padding:6px 4px;font-size:1.05rem;border-radius:14px}
.pn .lim{margin:8px 10px 10px;text-align:center;border-radius:12px;background:#d9c5ff;font-weight:600;padding:1px 4px;font-size:.95rem}
.pn .lim b{font-size:1.2em}
.pn.warn{animation:pulse 1s infinite}.pn.lost{border-color:var(--red);background:linear-gradient(#fff,#ffc9cf)}
.pn.lost .sc{color:var(--red)}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--gold),0 0 40px #ffd23a}}
.calc{margin-top:14px;padding:10px;border-radius:24px;border:3px solid #a05bff;background:linear-gradient(#4b14b8,#2a0a6b);box-shadow:0 0 24px rgba(122,44,255,.5)}
.calc h4{margin:0 0 6px;text-align:center;font-size:1.15rem}
.disp{border-radius:12px;background:#fff;color:var(--ink);text-align:center;font-weight:800;font-size:2rem;line-height:1.3;margin-bottom:8px}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.keys button{padding:6px 0;font-size:1.6rem;font-weight:800;border-radius:12px;color:var(--ink);background:linear-gradient(#fff,#dccbff);box-shadow:0 4px 0 #9c78e0;transition:transform .08s}
.keys button:active{transform:translateY(3px);box-shadow:0 1px 0 #9c78e0}
.ctl{display:grid;gap:7px;margin-top:8px;grid-template-columns:repeat(4,1fr)}
.ctl .btn3d{padding:8px 4px;font-size:1.1rem;border-radius:14px}
.ctl .btn3d.on{outline:3px solid var(--gold);box-shadow:0 5px 0 #34098a,0 0 20px var(--gold)}
.note{margin:14px auto 0;max-width:640px;padding:6px 16px;text-align:center;border:3px solid #a05bff;border-radius:999px;background:linear-gradient(#2a0a6b,#1a0450);font-weight:600}
.note b{color:var(--gold);font-size:1.15em}.note em{color:var(--red);font-weight:800;font-size:1.15em}
.small{display:block;margin:12px auto 0;font-size:1rem;padding:6px 18px}
/* modal & toast */
.ov{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:18px;background:rgba(5,0,15,.82)}
.ov.show{display:grid;animation:in .25s}
.ov.lose{background:radial-gradient(circle,rgba(255,30,60,.35),rgba(5,0,15,.92))}
.box{width:min(440px,100%);text-align:center;padding:22px 18px;border-radius:28px;border:4px solid var(--gold);background:linear-gradient(#4b14b8,#1d0850);box-shadow:0 0 50px rgba(122,44,255,.8)}
.lose .box{border-color:var(--red);box-shadow:0 0 60px rgba(255,40,70,.8)}
.box .ic{font-size:3.4rem;line-height:1}
.box h2{margin:6px 0;font-size:1.7rem}.box p{margin:0 0 14px;font-size:1.15rem;color:#e6d8ff}
.box .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.box .btn3d{font-size:1.1rem;padding:9px 20px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;z-index:60;padding:8px 20px;border-radius:999px;background:#fff;color:var(--ink);font-weight:800;box-shadow:0 0 24px #7a2cff;transition:.3s;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.shake{animation:shake .6s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.fall{position:fixed;top:-30px;z-index:55;pointer-events:none;font-size:1.8rem;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media(max-width:560px){.setup.two{grid-template-columns:1fr}.hd .lg{height:52px}.mbtn img{height:92px}.mbtn{min-height:100px}.ctl .btn3d{font-size:.95rem}.pn .bt button{font-size:.9rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="ov" id="ov"><div class="box"><div class="ic" id="mIc"></div><h2 id="mT"></h2><p id="mP"></p><div class="row" id="mB"></div></div></div>

<script>
(function(){
'use strict';
var LIMIT=101,$=function(s){return document.querySelector(s)},$$=function(s){return document.querySelectorAll(s)};
var KEY='hanamist-score-v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var S=load()||{view:'home',mode:null,names:[],scores:[],sel:0,input:'',over:false,loser:-1};

/* ---------- sound ---------- */
var AC=null;
function tone(f,d,t,type,vol){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+(t||0);o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(vol||.15,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d)}catch(e){}}
function sAdd(){tone(660,.12);tone(880,.15,.08)}
function sSub(){tone(520,.12);tone(380,.15,.08)}
function sWarn(){tone(740,.15,0,'square',.1);tone(740,.15,.22,'square',.1)}
function sLose(){[440,370,311,220].forEach(function(f,i){tone(f,.35,i*.28,'sawtooth',.14)})}
function sTick(){tone(1000,.04,0,'triangle',.08)}

/* ---------- ui helpers ---------- */
var tt;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},1800)}
function modal(o){
  $('#mIc').textContent=o.icon;$('#mT').textContent=o.title;$('#mP').textContent=o.msg;
  $('#ov').className='ov show'+(o.lose?' lose':'');
  var b=$('#mB');b.innerHTML='';
  o.buttons.forEach(function(x){var e=document.createElement('button');e.className='btn3d '+(x.cls||'');e.textContent=x.t;e.onclick=function(){$('#ov').className='ov';if(x.fn)x.fn()};b.appendChild(e)});
}
function confirmBox(title,msg,yes){modal({icon:'❓',title:title,msg:msg,buttons:[{t:'Batal',cls:'dark'},{t:'Ya, Lanjut',fn:yes}]})}
function show(v){S.view=v;$$('.view').forEach(function(e){e.classList.toggle('active',e.id===v)});window.scrollTo(0,0);save()}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hasProgress(){return S.mode&&S.scores.some(function(x){return x>0})}

/* ---------- navigation ---------- */
document.addEventListener('click',function(e){var g=e.target.closest('[data-go]');if(g)show(g.getAttribute('data-go'))});
$('#homeBtn').onclick=function(){show('home')};

/* ---------- start game ---------- */
function startGame(mode,names){
  function go(){S={view:'game',mode:mode,names:names,scores:names.map(function(){return 0}),sel:0,input:'',over:false,loser:-1};save();build();show('game');toast('Permainan dimulai!')}
  if(hasProgress())confirmBox('Mulai permainan baru?','Skor permainan sebelumnya akan dihapus.',go);else go();
}
$('#startG').onclick=function(){
  var a=$('#g1').value.trim(),b=$('#g2').value.trim();
  if(!a||!b){$('#errG').textContent='Kedua nama kelompok wajib diisi!';return}
  $('#errG').textContent='';startGame('G',[a,b]);
};
$('#startP').onclick=function(){
  var n=[];['p1','p2','p3','p4'].forEach(function(id){var v=$('#'+id).value.trim();if(v)n.push(v)});
  if(n.length<2){$('#errP').textContent='Isi minimal 2 nama pemain!';return}
  $('#errP').textContent='';startGame('P',n);
};

/* ---------- build game screen ---------- */
function build(){
  var G=S.mode==='G';
  $('#gTitle').innerHTML=G?'Tambah Skor<small>Untuk Kelompok</small>':'Main Perorangan<small>Catat skor tiap pemain</small>';
  $('#note').innerHTML=G?'⚠️ Jika Skor Melebihi <b>101</b>, Kelompok Akan <em>Kalah!</em>':'⚠️ Jika Skor Melebihi <b>101</b>, Pemain Akan <em>Kalah!</em>';
  var h='';
  S.names.forEach(function(n,i){
    h+='<div class="pn" data-i="'+i+'"><div class="nm">'+(G?'👥 ':'👤 ')+esc(n)+'</div><div class="sc" id="sc'+i+'">'+S.scores[i]+'</div>'+
    '<div class="bt"><button class="btn3d" data-add="'+i+'">＋ Tambah</button><button class="btn3d alt" data-sub="'+i+'">− Kurangi</button></div>'+
    '<div class="lim">Batas kalah: <b>'+LIMIT+'</b> poin</div></div>';
  });
  $('#pgrid').innerHTML=h;
  var k='';[1,2,3,4,5,6,7,8,9,0].forEach(function(d){k+='<button data-d="'+d+'">'+d+'</button>'});
  $('#keys').innerHTML=k;
  var c='<button class="btn3d alt" id="bDel">⌫ Hapus</button>';
  if(G)c+='<button class="btn3d" data-t="0">Tim A</button><button class="btn3d" data-t="1">Tim B</button>';
  else c+='<button class="btn3d dark" id="bReset">↻ Reset</button><button class="btn3d dark" id="bNext">Pemain ›</button>';
  c+='<button class="btn3d alt" id="bAdd">＋ Tambahkan</button>';
  $('#ctl').innerHTML=c;
  $('#ctl').style.gridTemplateColumns=G?'repeat(4,1fr)':'repeat(4,1fr)';
  refresh();
  S.names.forEach(function(_,i){mark(i)});
}
function refresh(){
  $('#disp').textContent=S.input===''?'0':S.input;
  $$('.pn').forEach(function(e){e.classList.toggle('sel',+e.dataset.i===S.sel)});
  $$('#ctl [data-t]').forEach(function(e){e.classList.toggle('on',+e.dataset.t===S.sel)});
  $('#cTitle').textContent='KALKULATOR SKOR – '+(S.names[S.sel]||'');
  $$('#game button').forEach(function(b){if(b.id!=='homeBtn'&&b.id!=='restart')b.disabled=S.over});
  save();
}
function mark(i){
  var p=$('.pn[data-i="'+i+'"]');if(!p)return;
  p.classList.toggle('lost',S.over&&S.loser===i);
  p.classList.toggle('warn',!S.over&&S.scores[i]===LIMIT);
}
function animate(i,from,to){
  var el=$('#sc'+i),t0=null,dur=380;el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');
  function step(t){if(!t0)t0=t;var p=Math.min(1,(t-t0)/dur);el.textContent=Math.round(from+(to-from)*p);if(p<1)requestAnimationFrame(step);else el.textContent=to}
  requestAnimationFrame(step);
}

/* ---------- scoring ---------- */
function apply(i,d){
  if(S.over)return;
  var old=S.scores[i],nw=Math.max(0,old+d),diff=nw-old;
  if(diff===0){toast(d<0?'Skor tidak boleh negatif!':'Tidak ada perubahan');return}
  S.scores[i]=nw;S.input='';animate(i,old,nw);
  toast(S.names[i]+(diff>0?' +':' −')+Math.abs(diff)+' → '+nw+' poin');
  if(diff>0)sAdd();else sSub();
  if(nw>LIMIT){lose(i)}
  else if(nw===LIMIT){sWarn();modal({icon:'⚠️',title:'PERINGATAN BATAS SKOR!',msg:(S.mode==='G'?'Kelompok ':'Pemain ')+S.names[i]+' telah mencapai 101 poin!',buttons:[{t:'Lanjut Main'}]})}
  mark(i);refresh();
}
function lose(i){
  S.over=true;S.loser=i;save();sLose();
  document.body.classList.add('shake');setTimeout(function(){document.body.classList.remove('shake')},700);
  var ems=['💥','😵','⭐','💜','🔥'];
  for(var n=0;n<24;n++){(function(n){setTimeout(function(){var s=document.createElement('span');s.className='fall';s.textContent=ems[n%5];s.style.left=Math.random()*95+'vw';document.body.appendChild(s);setTimeout(function(){s.remove()},2500)},n*80)})(n)}
  showLose();
}
function showLose(){
  var who=(S.mode==='G'?'Kelompok ':'Pemain ')+S.names[S.loser];
  modal({lose:true,icon:'🏆',title:'PERMAINAN BERAKHIR!',msg:who+' KALAH karena skornya melebihi 101 poin!',buttons:[{t:'MAIN LAGI',fn:replay},{t:'KEMBALI KE BERANDA',cls:'dark',fn:function(){show('home')}}]});
}
function replay(){S.scores=S.scores.map(function(){return 0});S.over=false;S.loser=-1;S.input='';S.sel=0;build();toast('Permainan diulang dari 0')}

/* ---------- events ---------- */
$('#pgrid').addEventListener('click',function(e){
  var a=e.target.closest('[data-add]'),s=e.target.closest('[data-sub]'),p=e.target.closest('.pn');
  if(a||s){var i=+(a||s).getAttribute(a?'data-add':'data-sub');S.sel=i;var v=S.input===''?1:parseInt(S.input,10);if(!v){toast('Masukkan angka lebih dari 0');return}apply(i,a?v:-v);return}
  if(p&&!S.over){S.sel=+p.dataset.i;sTick();refresh()}
});
$('#keys').addEventListener('click',function(e){var b=e.target.closest('[data-d]');if(!b||S.over)return;digit(b.dataset.d)});
function digit(d){if(S.input.length>=3)return;S.input=(S.input==='0'?'':S.input)+d;sTick();refresh()}
$('#ctl').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||S.over)return;
  if(b.id==='bDel'){S.input=S.input.slice(0,-1);refresh()}
  else if(b.dataset.t!==undefined){S.sel=+b.dataset.t;sTick();refresh()}
  else if(b.id==='bNext'){S.sel=(S.sel+1)%S.names.length;sTick();refresh()}
  else if(b.id==='bReset'){resetScores()}
  else if(b.id==='bAdd'){var v=parseInt(S.input||'0',10);if(!v){toast('Masukkan angka dulu!');return}apply(S.sel,v)}
});
function resetScores(){confirmBox('Reset skor?','Semua skor akan dikembalikan ke 0.',function(){replay();toast('Skor di-reset')})}
$('#restart').onclick=function(){confirmBox('Mulai ulang permainan?','Semua skor akan dikembalikan ke 0.',replay)};
document.addEventListener('keydown',function(e){
  if(S.view!=='game'||S.over||$('#ov').classList.contains('show')||e.target.tagName==='INPUT')return;
  if(/^[0-9]$/.test(e.key))digit(e.key);
  else if(e.key==='Backspace'){S.input=S.input.slice(0,-1);refresh()}
  else if(e.key==='Enter'){var v=parseInt(S.input||'0',10);if(v)apply(S.sel,v)}
});

/* ---------- init (restore after reload) ---------- */
if(S.view==='game'&&S.mode&&S.names.length){build();show('game');if(S.over&&S.loser>=0)showLose()}
else show(S.view==='setupG'||S.view==='setupP'?S.view:'home');
})();
</script>
</body>
</html>
